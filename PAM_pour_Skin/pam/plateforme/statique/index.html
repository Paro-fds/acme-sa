<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACME SA | PAM</title>
  <link rel="stylesheet" href="pam.css">
</head>
<body>
  <header>
    <p class="marque">ACME SA</p>
    <h1>PAM</h1>
    <p>Plateforme ACME Multifonctions</p>
  </header>
  <main>
    <section id="ecran-identification">
      <h2>1. Vous identifier</h2>
      <label>Code employé <span class="etoile">*</span>
        <input id="code" autocomplete="username" inputmode="text" required>
      </label>
      <label>Date de naissance <span class="etoile">*</span>
        <span class="secret">
          <input id="naissance" type="password" placeholder="JJMMAAAA" inputmode="numeric" maxlength="8" autocomplete="off" spellcheck="false" required>
          <button id="voir-naissance" class="voir" type="button">Afficher</button>
        </span>
      </label>
      <p id="captcha" hidden></p>
      <label id="ligne-captcha" hidden>Réponse <span class="etoile">*</span>
        <input id="reponse-captcha" inputmode="numeric">
      </label>
      <button id="continuer" type="button">Continuer</button>
      <p id="message-identification" class="message" role="alert"></p>
    </section>
    <section id="ecran-canal" hidden>
      <h2>2. Recevoir le code</h2>
      <button id="canal-email" type="button"></button>
      <button id="canal-whatsapp" type="button" disabled>WhatsApp — Indisponible</button>
      <p id="message-canal" class="message" role="alert"></p>
    </section>
    <section id="ecran-otp" hidden>
      <h2>3. Saisir le code</h2>
      <label>Code à 6 chiffres <span class="etoile">*</span>
        <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      </label>
      <p id="compte-a-rebours"></p>
      <button id="valider" type="button">Accéder à mes relevés</button>
      <button id="renvoyer" type="button">Renvoyer</button>
      <p id="message-otp" class="message" role="alert"></p>
    </section>
    <section id="ecran-balance" hidden>
      <div id="menu-principal">
        <h2>Menu principal</h2>
        <button id="choix-balance" type="button">Balance PER</button>
        <button id="choix-releve" type="button">Relevé PER</button>
        <button id="choix-paie" type="button">Fiche de paie</button>
        <button id="choix-main" type="button" hidden>Main levée</button>
      </div>
      <div id="zone-documents" hidden>
      <button id="retour-menu" class="secondaire" type="button">Menu principal</button>
      <h2>Mes documents</h2>
      <div class="onglets">
        <button id="onglet-balance" class="onglet actif" type="button">Balance PER</button>
        <button id="onglet-releve" class="onglet" type="button">Relevé PER</button>
        <button id="onglet-paie" class="onglet" type="button">Fiche de paie</button>
        <button id="onglet-main" class="onglet" type="button" hidden>Main levée</button>
      </div>
      <div id="panneau-balance">
        <p id="montant"></p>
        <p id="date-maj"></p>
      </div>
      <div id="panneau-releve" hidden>
        <p id="mois-disponibles"></p>
        <label>Date de début <span class="etoile">*</span>
          <input id="releve-debut" inputmode="numeric" maxlength="10" placeholder="JJ / MM / AAAA" autocomplete="off" required>
        </label>
        <label>Date de fin <span class="etoile">*</span>
          <input id="releve-fin" inputmode="numeric" maxlength="10" placeholder="JJ / MM / AAAA" autocomplete="off" required>
        </label>
        <button id="afficher-releve" type="button">Afficher le relevé</button>
        <p id="message-releve" class="message" role="alert"></p>
        <div id="releve-cartes"></div>
        <iframe id="releve-cadre" title="Relevé PER" hidden></iframe>
        <button id="releve-pdf" type="button" hidden>Relevé en PDF</button>
      </div>
      <div id="panneau-paie" hidden>
        <iframe id="fiche" title="Fiche de paie" hidden></iframe>
        <button id="enregistrer-pdf" type="button" hidden>Enregistrer en PDF</button>
        <div id="liste-bulletins"></div>
      </div>
      <div id="panneau-main" hidden>
        <p>Lève le gel de 72 heures d'un employé. L'adresse du dossier n'est pas modifiée.</p>
        <label>Code employé <span class="etoile">*</span>
          <input id="code-main-levee" autocomplete="off">
        </label>
        <button id="lever-gel" type="button">Lever le gel</button>
        <p id="message-main-levee" class="message" role="alert"></p>
      </div>
      </div>
      <p id="message-balance" class="message"></p>
      <button id="sortir" type="button">Fermer la session</button>
    </section>
  </main>
  <footer>ACME SA · PAM · La session se ferme après 5 minutes sans action.</footer>
  <script src="pam.js"></script>
</body>
</html>
